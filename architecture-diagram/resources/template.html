<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>[项目名称] 架构图</title>
  <style>
    :root {
      --text-primary: oklch(0.18 0.015 260);
      --text-muted: oklch(0.55 0.02 260);
      --text-btn: oklch(0.45 0.02 260);
      --border: oklch(0.9 0.008 260);
      --btn-bg: oklch(0.98 0.004 260);
      --btn-hover-bg: oklch(0.96 0.006 260);
      --btn-hover-border: oklch(0.82 0.01 260);
      --accent: oklch(0.55 0.2 250);
      --selection: oklch(0.85 0.06 250 / 0.35);
      --shadow-sm: 0 1px 2px oklch(0 0 0 / 0.04);
      --shadow-lg: 0 8px 24px oklch(0 0 0 / 0.06);
      --font-stack: 'Microsoft YaHei', 'PingFang SC', -apple-system, sans-serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: var(--font-stack);
      background: #ffffff;
      padding: 2.5rem;
      color: var(--text-primary);
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: var(--shadow-sm), var(--shadow-lg);
      padding: 2rem 2rem 2rem 2rem;
    }
    .header-row {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-bottom: 2px;
      padding: 0 4px;
    }
    .pulse-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      flex-shrink: 0;
      animation: pulse 2.4s ease-in-out infinite;
    }
    @media (prefers-reduced-motion: reduce) {
      .pulse-dot { animation: none; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.85); }
    }
    h1 {
      font-size: 18px;
      font-weight: 650;
      color: var(--text-primary);
      letter-spacing: -0.012em;
    }
    .subtitle {
      color: var(--text-muted);
      font-size: 13px;
      margin: 2px 0 16px 24px;
      font-weight: 420;
    }
    .diagram-container {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      overflow-x: auto;
    }
    svg { width: 100%; min-width: 900px; display: block; }
    .toolbar {
      display: flex;
      gap: 4px;
      margin-left: auto;
      flex-shrink: 0;
      align-items: center;
    }
    .toolbar-btn {
      background: var(--btn-bg);
      border: 1px solid var(--border);
      color: var(--text-btn);
      padding: 5px 12px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .toolbar-btn:hover {
      background: var(--btn-hover-bg);
      border-color: var(--btn-hover-border);
      color: var(--text-primary);
    }
    .toolbar-btn:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    .toolbar-divider {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 4px;
    }
    @media print {
      .toolbar { display: none !important; }
    }
    ::selection {
      background: var(--selection);
    }
  </style>
</head>
<body>
  <div class="container" id="report-container">
    <div class="header-row">
      <div class="pulse-dot"></div>
      <h1>[项目名称] 架构图</h1>
      <div class="toolbar">
        <button class="toolbar-btn" onclick="copyMermaid(this)">Mermaid</button>
        <div class="toolbar-divider"></div>
        <button class="toolbar-btn" onclick="copySVG(this)">复制 SVG</button>
        <button class="toolbar-btn" onclick="downloadSVG(this)">下载 SVG</button>
      </div>
    </div>
    <p class="subtitle">[项目简介 · 关键特性 · 技术栈]</p>

    <div class="diagram-container">
      <svg viewBox="0 0 1000 [HEIGHT]" role="img" aria-label="[项目名称] 架构图">
        <defs>
          <marker id="a-gray" markerWidth="8" markerHeight="5.5" refX="7" refY="2.75" orient="auto">
            <polygon points="0 0, 8 2.75, 0 5.5" fill="oklch(0.62 0.025 260)" />
          </marker>
          <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
            <path d="M 32 0 L 0 0 0 32" fill="none" stroke="oklch(0.96 0.006 250)" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="#ffffff" />
        <rect width="100%" height="100%" fill="url(#grid)" />
        <!-- AI 在此写入 SVG 节点和连线 -->
      </svg>
      <!-- AI 在此填充 Mermaid 定义（用于工具栏 Mermaid 导出） -->
      <pre style="display:none" class="mermaid-src">flowchart TD
  A[组件A] --> B[组件B]
      </pre>
    </div>
  </div>

  <script>
    function serializeSvg() {
      const svg = document.querySelector('svg');
      const clone = svg.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
      return '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(clone);
    }

    async function copySVG(btn) {
      const orig = btn.textContent;
      try {
        await navigator.clipboard.writeText(serializeSvg());
        btn.textContent = '✓ 已复制';
      } catch (e) {
        btn.textContent = '✗ 失败';
      }
      setTimeout(function() { btn.textContent = orig; }, 2000);
    }

    function downloadSVG(btn) {
      const orig = btn.textContent;
      try {
        const blob = new Blob([serializeSvg()], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = 'diagram.svg';
        link.click();
        URL.revokeObjectURL(url);
        btn.textContent = '✓ 完成';
      } catch (e) {
        btn.textContent = '✗ 失败';
      }
      setTimeout(function() { btn.textContent = orig; }, 2000);
    }

    async function copyMermaid(btn) {
      const orig = btn.textContent;
      const pre = document.querySelector('.mermaid-src');
      if (!pre) { btn.textContent = '✗ 失败'; setTimeout(function() { btn.textContent = orig; }, 2000); return; }
      try {
        await navigator.clipboard.writeText(pre.textContent);
        btn.textContent = '✓ 已复制';
      } catch (e) {
        btn.textContent = '✗ 失败';
      }
      setTimeout(function() { btn.textContent = orig; }, 2000);
    }
  </script>
</body>
</html>
