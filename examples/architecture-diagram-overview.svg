<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1080 760" role="img" aria-label="architecture-diagram SKILL 使用场景、使用说明、价值图" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
        <defs>
          <marker id="a-blue" markerWidth="8" markerHeight="5.5" refX="7" refY="2.75" orient="auto">
            <polygon points="0 0, 8 2.75, 0 5.5" fill="#5a82c2"/>
          </marker>
          <marker id="a-green" markerWidth="8" markerHeight="5.5" refX="7" refY="2.75" orient="auto">
            <polygon points="0 0, 8 2.75, 0 5.5" fill="#4a9e91"/>
          </marker>
          <marker id="a-purple" markerWidth="8" markerHeight="5.5" refX="7" refY="2.75" orient="auto">
            <polygon points="0 0, 8 2.75, 0 5.5" fill="#7a62a8"/>
          </marker>
          <marker id="a-amber" markerWidth="8" markerHeight="5.5" refX="7" refY="2.75" orient="auto">
            <polygon points="0 0, 8 2.75, 0 5.5" fill="#d47a5a"/>
          </marker>
          <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
            <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#e8e8ed" stroke-width="0.5"/>
          </pattern>
        </defs>
        <rect width="100%" height="100%" fill="#ffffff"/>
        <rect width="100%" height="100%" fill="url(#grid)"/>

        <!-- Header banner -->
        <rect x="40" y="24" width="1000" height="112" rx="12" fill="#f8fafc" stroke="#d8d8dc" stroke-width="1.2"/>
        <rect x="56" y="40" width="76" height="22" rx="5" fill="#5a82c2"/>
        <text x="94" y="55" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">产品概览</text>
        <text x="154" y="55" fill="#2d2d33" font-size="18" font-weight="700">把系统描述，快速变成专业架构图</text>
        <text x="56" y="82" fill="#808088" font-size="11">输入自然语言或设计文档，自动生成可编辑 Mermaid 源码、HTML 预览和可导入 PowerPoint 的 SVG。</text>
        <text x="56" y="103" fill="#808088" font-size="11">适合产品介绍、方案说明、团队知识沉淀，也适合非设计同学快速产出标准化图稿。</text>
        <rect x="820" y="40" width="196" height="78" rx="10" fill="#ffffff" stroke="#d8d8dc" stroke-width="1.1"/>
        <text x="918" y="63" fill="#2d2d33" font-size="13" font-weight="650" text-anchor="middle">输出形态</text>
        <text x="918" y="82" fill="#808088" font-size="10" text-anchor="middle">单个 HTML 文件</text>
        <text x="918" y="98" fill="#808088" font-size="10" text-anchor="middle">内嵌 CSS + SVG + JS</text>
        <text x="918" y="114" fill="#808088" font-size="10" text-anchor="middle">可复制 / 可下载 / 可演示</text>

        <!-- Left: scenarios -->
        <rect x="40" y="162" width="310" height="520" rx="12" fill="#f7fbff" stroke="#5a82c2" stroke-width="1.25" stroke-dasharray="5,3"/>
        <rect x="56" y="178" width="88" height="22" rx="5" fill="#5a82c2"/>
        <text x="100" y="193" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">使用场景</text>
        <text x="56" y="224" fill="#2d2d33" font-size="13" font-weight="650">什么时候用它</text>

        <rect x="64" y="248" width="278" height="74" rx="10" fill="#ffffff" stroke="#5a82c2" stroke-width="1.2"/>
        <text x="80" y="272" fill="#2d2d33" font-size="12" font-weight="650">架构说明</text>
        <text x="80" y="291" fill="#808088" font-size="10">把系统边界、组件、数据流讲清楚</text>
        <text x="80" y="307" fill="#808088" font-size="10">适合项目 README、技术方案评审、项目介绍</text>

        <rect x="64" y="336" width="278" height="74" rx="10" fill="#ffffff" stroke="#4a9e91" stroke-width="1.2"/>
        <text x="80" y="360" fill="#2d2d33" font-size="12" font-weight="650">流程转图</text>
        <text x="80" y="379" fill="#808088" font-size="10">把 SPEC / SRS / SOP 的步骤转成流程图</text>
        <text x="80" y="395" fill="#808088" font-size="10">适合需求梳理、执行流程、审批流</text>

        <rect x="64" y="424" width="278" height="74" rx="10" fill="#ffffff" stroke="#7a62a8" stroke-width="1.2"/>
        <text x="80" y="448" fill="#2d2d33" font-size="12" font-weight="650">知识沉淀</text>
        <text x="80" y="467" fill="#808088" font-size="10">把口头经验变成统一的图示资产</text>
        <text x="80" y="483" fill="#808088" font-size="10">适合团队知识沉淀、复盘、交接</text>

        <rect x="64" y="512" width="278" height="144" rx="10" fill="#ffffff" stroke="#d47a5a" stroke-width="1.2"/>
        <text x="80" y="536" fill="#2d2d33" font-size="12" font-weight="650">典型输入</text>
        <text x="80" y="559" fill="#808088" font-size="10">01 一段自然语言需求</text>
        <text x="80" y="578" fill="#808088" font-size="10">02 一份设计文档或 SPEC</text>
        <text x="80" y="597" fill="#808088" font-size="10">03 一个已有系统的文字说明</text>
        <text x="80" y="616" fill="#808088" font-size="10">04 一个需要对外说明的业务流程</text>
        <text x="80" y="640" fill="#808088" font-size="10">输出目标：让别人一眼看懂系统怎么工作。</text>

        <!-- Middle: how to use -->
        <rect x="385" y="162" width="310" height="520" rx="12" fill="#fbfff9" stroke="#4a9e91" stroke-width="1.25" stroke-dasharray="5,3"/>
        <rect x="401" y="178" width="88" height="22" rx="5" fill="#4a9e91"/>
        <text x="445" y="193" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">使用说明</text>
        <text x="401" y="224" fill="#2d2d33" font-size="13" font-weight="650">怎么用最顺手</text>

        <rect x="409" y="248" width="278" height="74" rx="10" fill="#ffffff" stroke="#4a9e91" stroke-width="1.2"/>
        <text x="425" y="272" fill="#2d2d33" font-size="12" font-weight="650">1. 描述系统</text>
        <text x="425" y="291" fill="#808088" font-size="10">用中文写清角色、组件、边界、数据流</text>
        <text x="425" y="307" fill="#808088" font-size="10">越接近业务语言，越容易生成正确结构</text>

        <rect x="409" y="336" width="278" height="74" rx="10" fill="#ffffff" stroke="#5a82c2" stroke-width="1.2"/>
        <text x="425" y="360" fill="#2d2d33" font-size="12" font-weight="650">2. 生成图稿</text>
        <text x="425" y="379" fill="#808088" font-size="10">AI 生成 HTML，内含可编辑 SVG 和 Mermaid</text>
        <text x="425" y="395" fill="#808088" font-size="10">默认白底、中文 UI、PPT 兼容色彩</text>

        <rect x="409" y="424" width="278" height="74" rx="10" fill="#ffffff" stroke="#7a62a8" stroke-width="1.2"/>
        <text x="425" y="448" fill="#2d2d33" font-size="12" font-weight="650">3. 预览与微调</text>
        <text x="425" y="467" fill="#808088" font-size="10">在浏览器里检查布局、文案、箭头走线</text>
        <text x="425" y="483" fill="#808088" font-size="10">需要时直接改 SVG 坐标或 Mermaid 源码</text>

        <rect x="409" y="512" width="278" height="144" rx="10" fill="#ffffff" stroke="#d47a5a" stroke-width="1.2"/>
        <text x="425" y="536" fill="#2d2d33" font-size="12" font-weight="650">操作顺序</text>
        <text x="425" y="559" fill="#808088" font-size="10">01 打开 .html 预览</text>
        <text x="425" y="578" fill="#808088" font-size="10">02 复制 Mermaid 给后续二次编辑</text>
        <text x="425" y="597" fill="#808088" font-size="10">03 复制或下载 SVG，用于文档 / PPT</text>
        <text x="425" y="616" fill="#808088" font-size="10">04 如有问题，用质量检查器验证输出</text>
        <text x="425" y="640" fill="#808088" font-size="10">关键习惯：先讲清业务，再让图形自动化。</text>

        <!-- Right: value -->
        <rect x="730" y="162" width="310" height="520" rx="12" fill="#fffaf6" stroke="#d47a5a" stroke-width="1.25" stroke-dasharray="5,3"/>
        <rect x="746" y="178" width="88" height="22" rx="5" fill="#d47a5a"/>
        <text x="790" y="193" fill="#ffffff" font-size="11" font-weight="600" text-anchor="middle">价值图</text>
        <text x="746" y="224" fill="#2d2d33" font-size="13" font-weight="650">为什么值得推广</text>

        <rect x="754" y="248" width="278" height="74" rx="10" fill="#ffffff" stroke="#d47a5a" stroke-width="1.2"/>
        <text x="770" y="272" fill="#2d2d33" font-size="12" font-weight="650">提效</text>
        <text x="770" y="291" fill="#808088" font-size="10">减少手动画图时间，把精力留给表达</text>
        <text x="770" y="307" fill="#808088" font-size="10">适合高频方案、汇报、分享场景</text>

        <rect x="754" y="336" width="278" height="74" rx="10" fill="#ffffff" stroke="#5a82c2" stroke-width="1.2"/>
        <text x="770" y="360" fill="#2d2d33" font-size="12" font-weight="650">标准化</text>
        <text x="770" y="379" fill="#808088" font-size="10">统一白底、字体、配色、箭头和层级</text>
        <text x="770" y="395" fill="#808088" font-size="10">同一套方法，交付风格更一致</text>

        <rect x="754" y="424" width="278" height="74" rx="10" fill="#ffffff" stroke="#4a9e91" stroke-width="1.2"/>
        <text x="770" y="448" fill="#2d2d33" font-size="12" font-weight="650">可复用</text>
        <text x="770" y="467" fill="#808088" font-size="10">Mermaid 源码可继续迭代，SVG 可直接交付</text>
        <text x="770" y="483" fill="#808088" font-size="10">既适合演示，也适合沉淀到仓库里</text>

        <rect x="754" y="512" width="278" height="144" rx="10" fill="#ffffff" stroke="#7a62a8" stroke-width="1.2"/>
        <text x="770" y="536" fill="#2d2d33" font-size="12" font-weight="650">可以这样介绍</text>
        <text x="770" y="559" fill="#808088" font-size="10">1. 先讲业务问题，为什么要画图</text>
        <text x="770" y="578" fill="#808088" font-size="10">2. 再讲输入方式，怎么让 AI 理解</text>
        <text x="770" y="597" fill="#808088" font-size="10">3. 然后看输出，如何复制、下载、复用</text>
        <text x="770" y="616" fill="#808088" font-size="10">4. 最后强调价值：提效、统一、可传播</text>
        <text x="770" y="640" fill="#808088" font-size="10">一句话总结：让不会画图的人，也能产出专业图。</text>

        <!-- Bottom workflow -->
        <rect x="40" y="704" width="1000" height="32" rx="8" fill="#ffffff" stroke="#d8d8dc" stroke-width="1.0"/>
        <text x="58" y="724" fill="#2d2d33" font-size="11" font-weight="650">阅读路径</text>
        <rect x="146" y="710" width="60" height="20" rx="10" fill="#f7fbff" stroke="#5a82c2" stroke-width="1.0"/>
        <text x="176" y="724" fill="#2d2d33" font-size="10" font-weight="600" text-anchor="middle">场景</text>
        <text x="218" y="724" fill="#808088" font-size="10" text-anchor="middle">&gt;</text>
        <rect x="234" y="710" width="60" height="20" rx="10" fill="#fbfff9" stroke="#4a9e91" stroke-width="1.0"/>
        <text x="264" y="724" fill="#2d2d33" font-size="10" font-weight="600" text-anchor="middle">用法</text>
        <text x="306" y="724" fill="#808088" font-size="10" text-anchor="middle">&gt;</text>
        <rect x="322" y="710" width="60" height="20" rx="10" fill="#fffaf6" stroke="#d47a5a" stroke-width="1.0"/>
        <text x="352" y="724" fill="#2d2d33" font-size="10" font-weight="600" text-anchor="middle">价值</text>
        <text x="394" y="724" fill="#808088" font-size="10" text-anchor="middle">&gt;</text>
        <rect x="410" y="710" width="60" height="20" rx="10" fill="#f8f5ff" stroke="#7a62a8" stroke-width="1.0"/>
        <text x="440" y="724" fill="#2d2d33" font-size="10" font-weight="600" text-anchor="middle">实践</text>
        <text x="780" y="724" fill="#808088" font-size="10">建议配合示例文件和真实项目案例一起阅读</text>
      </svg>
